# Deploy the API on Render: New -> Blueprint -> pick this repository.
#
# The database is deliberately NOT created here: Render's free Postgres is deleted after 30 days.
# Use a permanent free Postgres instead (Neon: neon.tech) and paste its connection string into
# DATABASE_URL when Render asks. See backend/README.md section 7.
services:
  - type: web
    name: vendly-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/db/migrate.js && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
