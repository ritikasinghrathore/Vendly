# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendly
      POSTGRES_PASSWORD: vendly_dev_password
      POSTGRES_DB: vendly
    ports:
      - "5432:5432"
    volumes:
      - vendly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendly -d vendly"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vendly_pg:
